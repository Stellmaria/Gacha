name: Prototype checks
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test weighted selection and pointer geometry
        run: node --test
      - name: Validate browser modules
        run: |
          node --check src/app.mjs
          node --check src/wheels.mjs
      - name: Verify Telegram preflight offline (no tokens)
        run: python3 -m unittest discover -s tests_python -v
      - name: Compile Telegram preflight script
        run: python3 -m py_compile scripts/telegram_preflight.py
      - name: Check static HTML entry
        run: test -s index.html && test -s styles.css && test -s README.md

  gif-render-test:
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned GIF dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Validate six original GIFs and native chat Royal TGS UX
        run: python -m unittest tests_python.test_wheel_gif tests_python.test_ornate_wheel tests_python.test_telegram_chat_royal_pilot -v
      - name: Render first frame and verify sector colors, ruby and transparency
        run: python -m scripts.render_tgs_visual_smoke gacha-tgs-rendered-preview.png
      - uses: actions/upload-artifact@v4
        with:
          name: gacha-royal-tgs-rendered-preview
          path: gacha-tgs-rendered-preview.png
          retention-days: 7

  mvp1-postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: gacha_ci
          POSTGRES_PASSWORD: gacha_test_only
          POSTGRES_DB: gacha_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gacha_ci -d gacha_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      # Ephemeral CI-only PostgreSQL service, never a production database.
      GACHA_DATABASE_URL: postgresql://gacha_ci:gacha_test_only@localhost:5432/gacha_ci
      GACHA_TEST_DATABASE_URL: postgresql://gacha_ci:gacha_test_only@localhost:5432/gacha_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated Gacha PostgreSQL client
        run: python -m pip install --disable-pip-version-check -r requirements-mvp1.txt
      - name: Apply migrations twice (verify repeatable setup)
        run: |
          python -m gacha_core.migrate
          python -m gacha_core.migrate
      - name: Exercise real PG18 daily quota, duplicate spins, outbox and concurrency
        run: python -m unittest tests_python.test_mvp1_domain tests_python.test_mvp1_card_store tests_python.test_mvp1_telegram_api tests_python.test_mvp1_telegram_adapter tests_python.test_mvp1_postgres -v
