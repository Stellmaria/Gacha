name: Telegram Bot API — ручная проверка

# Manual only. NEVER trigger with PR/push/schedule: can access bot credentials.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Какой Telegram API проверять? По умолчанию — существующий бот гачи."
        type: choice
        options:
          - existing-test-bot
          - telegram-test-server
          - separate-production-bot
        default: existing-test-bot
        required: true

permissions:
  contents: read

concurrency:
  group: gacha-telegram-preflight-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  existing-test-bot:
    if: ${{ inputs.target == 'existing-test-bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check existing Gacha test bot on ordinary Telegram API (read-only)
        env:
          GACHA_BOT_TOKEN: ${{ secrets.GACHA_TEST_BOT_TOKEN }}
        run: python3 scripts/telegram_preflight.py --target production

  telegram-test-server:
    if: ${{ inputs.target == 'telegram-test-server' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check a dedicated Telegram Test Server account bot (read-only)
        env:
          GACHA_BOT_TOKEN: ${{ secrets.GACHA_TEST_BOT_TOKEN }}
        run: python3 scripts/telegram_preflight.py --target test

  separate-production-bot:
    if: ${{ inputs.target == 'separate-production-bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Check future separate production bot (read-only)
        env:
          GACHA_BOT_TOKEN: ${{ secrets.GACHA_BOT_TOKEN }}
        run: python3 scripts/telegram_preflight.py --target production
